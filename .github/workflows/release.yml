name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  ZIG_VERSION: 0.17.0-dev.2267+48abf1a34

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build test --summary all

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: x86_64-linux
            target: x86_64-linux-musl
          - name: aarch64-linux
            target: aarch64-linux-musl
          - name: x86_64-macos
            target: x86_64-macos
          - name: aarch64-macos
            target: aarch64-macos
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe

      - name: Package
        run: |
          mkdir -p dist
          install -m755 zig-out/bin/zurlencode dist/zurlencode
          tar -czf zurlencode-${{ matrix.name }}.tar.gz -C dist zurlencode

      - uses: actions/upload-artifact@v4
        with:
          name: zurlencode-${{ matrix.name }}
          path: zurlencode-${{ matrix.name }}.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum *.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            SHA256SUMS
          generate_release_notes: true
